{{- $ns := printf "team-%s" .Values.team -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.team }}-api
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .Values.team }}-api
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.team }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.team }}-api
    spec:
      serviceAccountName: deployer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.app.image }}
          command: ["./podinfo", "--port=9898", "--level=warn"]
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.team }}-api
  namespace: {{ $ns }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.team }}-api
  ports:
    - name: http
      port: 80
      targetPort: http
