    node_groups = { default = { instance_types = ["m7i-flex.large"], desired_size = 2, min_size = 1, max_size = 4, labels = { tier = "general" } } }

- id: S03
  name: Add a second node group of an approved type
  stack: infra
  expect: []
  tfvars: |
    node_groups = {
      default = { instance_types = ["m7i-flex.large"], desired_size = 2, min_size = 1, max_size = 4 }
      batch   = { instance_types = ["c7i-flex.large"], desired_size = 1, min_size = 0, max_size = 3 }
    }

- id: S04
  name: Upgrade Kubernetes one minor version (1.34 -> 1.35)
  stack: infra
  expect: []
  tfvars: |
    kubernetes_version = "1.35"

- id: S05
  name: Add a second operator CIDR to the API allowlist
  stack: infra
  expect: []
  tfvars: |
    public_access_cidrs = ["192.0.2.10/32", "198.51.100.0/28"]

