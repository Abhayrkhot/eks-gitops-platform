# Pull-request fixtures for the plan-time policy gate.
#
# Each fixture is a change someone could open a PR with: tfvars edits, extra
# resources, or edits to module code. The runner copies terraform/, applies
# the change, runs a real `terraform plan` against the environment's remote
# state, and feeds `terraform show -json` to conftest.
#   expect: [TF...]  unsafe - every listed rule must fire
#   expect: []       safe   - no rule may fire (false-positive check)
#   requires: aws    needs resources the local emulator cannot model (EKS add-ons)

# ------------------------------------------------------------ network exposure
- id: U01
  name: SSH open to the internet on a debug security group
  stack: infra
  expect: [TF001]
  add: |
    resource "aws_security_group" "debug" {
      name   = "debug-ssh"
      vpc_id = module.platform.vpc_id
      ingress {
        from_port   = 22
        to_port     = 22
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }

- id: U02
  name: All ports open to the internet (protocol -1)
  stack: infra
  expect: [TF001]
  add: |
    resource "aws_security_group" "wide" {
      name   = "wide-open"
      vpc_id = module.platform.vpc_id
    }
    resource "aws_vpc_security_group_ingress_rule" "everything" {
      security_group_id = aws_security_group.wide.id
      cidr_ipv4         = "0.0.0.0/0"
      ip_protocol       = "-1"
    }

- id: U03
  name: Kubernetes API port 6443 open to all IPv6
  stack: infra
  expect: [TF001]
  add: |
    resource "aws_security_group" "api6" {
      name   = "k8s-api-v6"
      vpc_id = module.platform.vpc_id
    }
    resource "aws_security_group_rule" "api6" {
      type              = "ingress"
      security_group_id = aws_security_group.api6.id
      from_port         = 6443
      to_port           = 6443
      protocol          = "tcp"
      ipv6_cidr_blocks  = ["::/0"]
    }

- id: U04
  name: EKS public endpoint opened to 0.0.0.0/0
  stack: infra
  expect: [TF002]
  tfvars: |
    public_access_cidrs = ["0.0.0.0/0"]

- id: U05
  name: EKS public endpoint with no CIDR list (AWS default is the whole internet)
  stack: infra
  expect: [TF002]
  tfvars: |
    public_access_cidrs = []

# --------------------------------------------------------------------- EKS
- id: U06
  name: Control-plane audit logging turned off
  stack: infra
  expect: [TF004]
  tfvars: |
    cluster_log_types = []

- id: U07
  name: Cluster moved to EXTENDED support
  stack: infra
  expect: [TF005]
  tfvars: |
    cluster_support_type = "EXTENDED"

- id: U08
  name: Kubernetes downgrade 1.34 -> 1.33
  stack: infra
  expect: [TF006]
  tfvars: |
    kubernetes_version = "1.33"

- id: U09
  name: Kubernetes upgrade that skips a minor (1.34 -> 1.36)
  stack: infra
  expect: [TF006]
  tfvars: |
    kubernetes_version = "1.36"

- id: U10
  name: GPU instance type in the node group
  stack: infra
  expect: [TF007]
  tfvars: |
    node_groups = { default = { instance_types = ["p5.48xlarge"], desired_size = 2, min_size = 1, max_size = 4 } }

- id: U11
  name: Node group allowed to scale to 50 nodes
  stack: infra
  expect: [TF008]
  tfvars: |
    node_groups = { default = { instance_types = ["m7i-flex.large"], desired_size = 2, min_size = 1, max_size = 50 } }

- id: U12
  name: VPC CIDR change (replaces the VPC and every subnet)
  stack: infra
  expect: [TF016]
  tfvars: |
    vpc_cidr = "10.41.0.0/16"

- id: U13
  name: Cluster rename (replaces the EKS cluster)
  stack: infra
  expect: [TF016]
  tfvars: |
    name = "gitops2"

- id: U14
  name: Remove an availability zone (deletes subnets in use)
  stack: infra
  expect: [TF016]
  tfvars: |
    azs = ["us-east-2a", "us-east-2b"]

- id: U15
  name: Remove the NAT gateway (private nodes lose egress)
  stack: infra
  expect: [TF016]
  tfvars: |
    nat_gateway = false

- id: U16
  name: Switch EKS auth back to the aws-auth ConfigMap
  stack: infra
  expect: [TF003]
  patch:
    - file: modules/eks-cluster/main.tf
      find: 'authentication_mode                         = "API"'
      replace: 'authentication_mode                         = "CONFIG_MAP"'

- id: U17
  name: Drop CoreDNS from the managed add-ons
  stack: infra
  requires: aws
  expect: [TF021]
  tfvars: |
    after_compute_addons = {}

- id: U18
  name: Grant cluster-admin to an outside contractor role
  stack: infra
  expect: [TF022]
  add: |
    resource "aws_eks_access_policy_association" "contractor" {
      cluster_name  = module.platform.cluster_name
      principal_arn = "arn:aws:iam::123456789012:role/contractor"
      policy_arn    = "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
      access_scope {
        type = "cluster"
      }
    }

# ----------------------------------------------------------------- compute
- id: U19
  name: Launch template that allows IMDSv1
  stack: infra
  expect: [TF019]
  patch:
    - file: modules/eks-node-group/main.tf
      find: 'http_tokens                 = "required"'
      replace: 'http_tokens                 = "optional"'

- id: U20
  name: Unencrypted node volumes
  stack: infra
  expect: [TF020]
  patch:
    - file: modules/eks-node-group/main.tf
      find: 'encrypted             = true'
      replace: 'encrypted             = false'

# ---------------------------------------------------------------------- S3
- id: U21
  name: Public-read bucket ACL
  stack: infra
  expect: [TF009]
  add: |
    resource "aws_s3_bucket" "assets" {
      bucket = "gitops-local-public-assets"
    }
    resource "aws_s3_bucket_acl" "assets" {
      bucket = aws_s3_bucket.assets.id
      acl    = "public-read"
    }

- id: U22
  name: Bucket with public access block turned off
  stack: infra
  expect: [TF009]
  add: |
    resource "aws_s3_bucket" "exports" {
      bucket = "gitops-local-exports"
    }
    resource "aws_s3_bucket_public_access_block" "exports" {
      bucket                  = aws_s3_bucket.exports.id
      block_public_acls       = false
      block_public_policy     = false
      ignore_public_acls      = false
      restrict_public_buckets = false
    }

- id: U23
  name: Bucket policy granting anonymous read
  stack: infra
  expect: [TF009]
  add: |
    resource "aws_s3_bucket" "share" {
      bucket = "gitops-local-share"
    }
    resource "aws_s3_bucket_policy" "share" {
      bucket = aws_s3_bucket.share.id
      policy = jsonencode({
        Version = "2012-10-17"
        Statement = [{ Effect = "Allow", Principal = "*", Action = "s3:GetObject", Resource = "arn:aws:s3:::gitops-local-share/*" }]
      })
    }

- id: U24
  name: Suspend versioning on the state bucket
  stack: bootstrap
  expect: [TF010]
  patch:
    - file: modules/state-backend/main.tf
      find: 'status = "Enabled"'
      replace: 'status = "Suspended"'

- id: U25
  name: Remove the state bucket's public access block
  stack: bootstrap
  expect: [TF010]
  patch:
    - file: modules/state-backend/main.tf
      find: 'resource "aws_s3_bucket_public_access_block" "state" {'
      replace: "resource \"aws_s3_bucket_public_access_block\" \"state\" {\n  count = 0"
    - file: modules/state-backend/main.tf
      find: 'depends_on = [aws_s3_bucket_public_access_block.state]'
      replace: 'depends_on = []'

- id: U26
  name: force_destroy on a shared state bucket
  stack: bootstrap
  expect: [TF010]
  tfvars: |
    state_bucket_name   = "eks-gitops-tfstate-shared"
    force_destroy_state = true

# --------------------------------------------------------------------- IAM
- id: U27
  name: Customer-managed policy granting *:* on *
  stack: infra
  expect: [TF011]
  add: |
    resource "aws_iam_policy" "ops" {
      name = "ops-everything"
      policy = jsonencode({
        Version   = "2012-10-17"
        Statement = [{ Effect = "Allow", Action = "*", Resource = "*" }]
      })
    }

- id: U28
  name: Inline iam:* on the node role
  stack: infra
  expect: [TF011]
  add: |
    resource "aws_iam_role_policy" "node_iam" {
      name = "node-iam"
      role = element(split("/", module.platform.node_role_arns["default"]), length(split("/", module.platform.node_role_arns["default"])) - 1)
      policy = jsonencode({
        Version   = "2012-10-17"
        Statement = [{ Effect = "Allow", Action = ["iam:*"], Resource = "*" }]
      })
    }

- id: U29
  name: AdministratorAccess attached to the node role
  stack: infra
  expect: [TF012]
  add: |
    resource "aws_iam_role_policy_attachment" "node_admin" {
      role       = element(split("/", module.platform.node_role_arns["default"]), length(split("/", module.platform.node_role_arns["default"])) - 1)
      policy_arn = "arn:aws:iam::aws:policy/AdministratorAccess"
    }

- id: U30
  name: AdministratorAccess attached to the CI apply role
  stack: bootstrap
  expect: [TF012]
  add: |
    resource "aws_iam_role_policy_attachment" "apply_admin" {
      role       = "eks-gitops-apply"
      policy_arn = "arn:aws:iam::aws:policy/AdministratorAccess"
    }

- id: U31
  name: IAM user with a long-lived access key
  stack: infra
  expect: [TF013]
  add: |
    resource "aws_iam_user" "deploy" {
      name = "deploy-bot"
    }
    resource "aws_iam_access_key" "deploy" {
      user = aws_iam_user.deploy.name
    }

- id: U32
  name: New role without the permissions boundary
  stack: infra
  expect: [TF014]
  add: |
    resource "aws_iam_role" "worker" {
      name = "gitops-local-worker"
      assume_role_policy = jsonencode({
        Version   = "2012-10-17"
        Statement = [{ Effect = "Allow", Principal = { Service = "ec2.amazonaws.com" }, Action = "sts:AssumeRole" }]
      })
    }

- id: U33
  name: Role any AWS account can assume
  stack: infra
  expect: [TF015]
  add: |
    resource "aws_iam_role" "shared" {
      name                 = "gitops-local-shared"
      permissions_boundary = "arn:aws:iam::123456789012:policy/eks-gitops-ci/eks-gitops-boundary"
      assume_role_policy = jsonencode({
        Version   = "2012-10-17"
        Statement = [{ Effect = "Allow", Principal = { AWS = "*" }, Action = "sts:AssumeRole" }]
      })
    }

- id: U34
  name: GitHub OIDC trust for any repository
  stack: bootstrap
  expect: [TF015]
  patch:
    - file: modules/ci-iam/main.tf
      find: '"repo:${local.repo}:pull_request"'
      replace: '"repo:*:pull_request"'

- id: U35
  name: Remove a deny statement from the permissions boundary
  stack: bootstrap
  expect: [TF024]
  patch:
    - file: modules/ci-iam/main.tf
      find: 'Sid      = "DenyRolesWithoutBoundary"'
      replace: 'Sid      = "TemporarilyRelaxed"'

- id: U36
  name: Delete the GitHub OIDC provider
  stack: bootstrap
  expect: [TF016]
  tfvars: |
    create_oidc_provider = false

# ----------------------------------------------------------------- hygiene
- id: U37
  name: Drop the Owner tag from the default tags
  stack: infra
  expect: [TF017]
  patch:
    - file: live/infra/main.tf
      find: '    Owner       = "platform-team"'
      replace: ''

- id: U38
  name: Deploy to an unapproved region
  stack: infra
  expect: [TF018]
  tfvars: |
    region = "eu-west-1"
    azs    = ["eu-west-1a", "eu-west-1b", "eu-west-1c"]

- id: U39
  name: Control-plane log group that never expires
  stack: infra
  expect: [TF023]
  patch:
    - file: modules/eks-cluster/main.tf
      find: 'retention_in_days = var.log_retention_days'
      replace: 'retention_in_days = 0'

- id: U40
  name: Weaken the boundary's state-bucket protection
  stack: bootstrap
  expect: [TF024]
  patch:
    - file: modules/ci-iam/main.tf
      find: 'Sid    = "DenyStateBucketTampering"'
      replace: 'Sid    = "StateBucketNote"'

# --------------------------------------------- safe changes (must pass)
- id: S01
  name: Scale the node group from 2 to 3
  stack: infra
  expect: []
  tfvars: |
    node_groups = { default = { instance_types = ["m7i-flex.large"], desired_size = 3, min_size = 1, max_size = 4 } }

- id: S02
  name: Add a node label
  stack: infra
  expect: []
