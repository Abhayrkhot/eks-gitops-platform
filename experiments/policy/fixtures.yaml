  name: Public HTTPS-only security group for a load balancer
  stack: infra
  expect: []
  add: |
    resource "aws_security_group" "web" {
      name   = "public-https"
      vpc_id = module.platform.vpc_id
      ingress {
        from_port   = 443
        to_port     = 443
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }

- id: S07
  name: Cluster-admin for the platform-admins role
  stack: infra
  expect: []
  add: |
    resource "aws_eks_access_policy_association" "platform_admins" {
      cluster_name  = module.platform.cluster_name
      principal_arn = "arn:aws:iam::123456789012:role/platform-admins/oncall"
      policy_arn    = "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
      access_scope {
        type = "cluster"
      }
    }

- id: S08
  name: Longer control-plane log retention
  stack: infra
  expect: []
  patch:
    - file: modules/eks-cluster/variables.tf
      find: "  default = 7\n"
      replace: "  default = 14\n"

- id: S09
  name: New least-privilege role with the boundary
  stack: infra
  expect: []
  add: |
    resource "aws_iam_role" "reader" {
      name                 = "gitops-local-reader"
      path                 = "/eks-gitops/"
      permissions_boundary = "arn:aws:iam::123456789012:policy/eks-gitops-ci/eks-gitops-boundary"
      assume_role_policy = jsonencode({
        Version   = "2012-10-17"
        Statement = [{ Effect = "Allow", Principal = { Service = "ec2.amazonaws.com" }, Action = "sts:AssumeRole" }]
      })
    }
    resource "aws_iam_role_policy" "reader" {
      name = "read-eks"
      role = aws_iam_role.reader.id
      policy = jsonencode({
        Version   = "2012-10-17"
        Statement = [{ Effect = "Allow", Action = ["eks:DescribeCluster", "eks:ListClusters"], Resource = "*" }]
      })
    }

- id: S10
  name: Add a CostCenter tag everywhere
  stack: infra
  expect: []
  patch:
    - file: live/infra/main.tf
      find: '    Owner       = "platform-team"'
      replace: "    Owner       = \"platform-team\"\n    CostCenter  = \"platform\""

- id: S11
  name: Allow another instance type in the CI boundary
  stack: bootstrap
  expect: []
  patch:
    - file: modules/ci-iam/variables.tf
      find: '"c7i-flex.large"]'
      replace: '"c7i-flex.large", "t3.large"]'

- id: S12
  name: Private bucket with every protection on
  stack: infra
  expect: []
  add: |
    resource "aws_s3_bucket" "artifacts" {
      bucket = "gitops-local-artifacts"
    }
    resource "aws_s3_bucket_public_access_block" "artifacts" {
      bucket                  = aws_s3_bucket.artifacts.id
      block_public_acls       = true
      block_public_policy     = true
      ignore_public_acls      = true
      restrict_public_buckets = true
    }
